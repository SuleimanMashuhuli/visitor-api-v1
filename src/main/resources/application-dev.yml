server:
  port: 8094

spring:
# ============ JPA CONFIGURATION ============
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    generate-ddl: true
# ============ DATABASE CONFIGURATION ============
  datasource:
    username: visitor
    password: root
    url: jdbc:postgresql://localhost:5432/visitor_db
    driver-class-name: org.postgresql.Driver
# ============ EMAIL CONFIGURATION ============
  mail:
    host: 172.16.2.60
    port: 25
# ============ CACHING CONFIGURATION ============
  cache:
    type: redis
    redis:
      time-to-live: 600s
# ============ REDIS CONFIGURATION ============
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      repositories:
        enabled: false
# ============ JWT CONFIGURATION ============
app:
  jwt:
    secret: my-super-secret-key-for-development-only
    expiration: 86400000
    
  constants:
    email-api:
      url: http://10.10.6.3:8085
    
  setup: 
    admin: 
      username: ${INITIAL_ADMIN_USERNAME:admin} 
      email: ${INITIAL_ADMIN_EMAIL:internalsupport@abcthebank.com}
      password: ${INITIAL_ADMIN_PASSWORD:ChangeMe123!}
      branch: ${INITIAL_ADMIN_BRANCH:HEAD_OFFICE}